name: secondbrain
description: "세컨드 브레인 — macOS 데스크톱 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

workspace:
  - packages/brain_core
  - packages/brain_cli

dependencies:
  brain_core:
    path: packages/brain_core
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  path: ^1.9.1
  shadcn_ui: ^0.57.4
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 연동 묶음 원본과 brain CLI (bash tool/build_brain.sh로 먼저 만든다)
  assets:
    - assets/brain/bin/
    - assets/brain/lib/
    - integrations/claude-code/
    - integrations/claude-code/skills/second-brain/
    - integrations/claude-code/skills/brain-save/
    - integrations/claude-code/skills/brain-ingest/
    - integrations/claude-code/skills/brain-lint/
    - integrations/claude-code/agents/

  # Pretendard v1.3.9 (OFL-1.1, assets/fonts/pretendard/LICENSE.txt). 쓰는 굵기 4개만 넣는다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 700
