name: secondbrain
description: "세컨드 브레인 — macOS 데스크톱 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

workspace:
  - packages/brain_core
  - packages/brain_cli

dependencies:
  brain_core:
    path: packages/brain_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  shadcn_ui: ^0.57.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
