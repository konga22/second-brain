# 규칙 매칭 시험 (기능검토 2절 품질 측정 묶음·4-4, 실수 노트 L-0008)
# 실수 노트마다 사용자 말투로 바꾼 "걸려야 할 요청"(hit) 5개와 "걸리면 안 될 요청"(miss) 5개.
# hit는 trigger 문장과 일부러 다른 말로 썼다. miss는 같은 단어가 들어 있어도 그 상황이 아닌 요청이다.
# 2026-11-09, 맞추기 결과를 보기 전에 썼다. 실행: brain bench --lessons bench/lessons.yaml
# none: 어느 실수 노트에도 걸리면 안 되고, 노트를 미리 넣어도 안 되는 요청.

- lesson: L-0001   # 기능을 만들거나 고칠 때 → 오류 처리·진행 표시·실데이터 시험·실제 앱 실행
  hit:
    - 검색 결과 CSV로 내보내기 버튼 만들어 줘
    - 설정 화면에 다크 모드 토글 추가해 줘
    - 노트 목록 정렬이 이상해, 손봐 줘
    - 가져오기에 PDF도 되게 해 줘
    - 할 일 화면에 마감일 넣어 줘
  miss:
    - 기능검토 문서 요약해 줘
    - 이 에러 메시지 뜻이 뭐야?
    - 오늘 한 일 정리해 줘
    - Riverpod이 뭐야?
    - 커밋 로그 보여 줘

- lesson: L-0002   # 커밋하거나 push할 때 → 매번 허락
  hit:
    - 변경 사항 올려 줘
    - 원격에 반영해 줘
    - 깃에 저장하고 깃허브에 올려
    - 작업한 거 커밋해
    - PR 만들기 전에 푸시해 둬
  miss:
    - 지난 커밋 기록 보여 줘
    - 깃허브 레포 주소 알려 줘
    - 브랜치 이름 규칙 알려 줘
    - push 알림이 안 와
    - git이 뭐야?

- lesson: L-0003   # 실행 중인 프로세스(앱 등)를 끌 때 → 시작 시각·실행 주체 확인
  hit:
    - 포트 8080 잡고 있는 거 죽여 줘
    - 앱 다시 켜 줘
    - 멈춘 서버 꺼 줘
    - flutter run 돌던 거 종료하고 새로 실행해
    - 백그라운드 작업 kill 해
  miss:
    - 프로세스랑 스레드 차이가 뭐야?
    - 앱 아이콘 바꿔 줘
    - 서버 로그 보여 줘
    - 화면 꺼짐 시간 설정 어디서 해?
    - 실행 중인 프로세스 목록만 보여 줘

- lesson: L-0004   # Flutter/Dart Isolate.run(compute) → 최상위 함수·단순 값
  hit:
    - 무거운 파싱을 백그라운드 isolate로 돌려 줘
    - compute로 JSON 디코딩 옮겨 줘
    - 색인 작업이 화면을 멈추게 해, 다른 스레드로 빼 줘
    - Notifier에서 Isolate.run 써서 정렬 돌리고 싶어
    - 앱 시작할 때 노트 읽기를 백그라운드로 해 줘
  miss:
    - Dart에서 Future랑 Stream 차이
    - Flutter 위젯 테스트 쓰는 법
    - JSON 파일 형식 알려 줘
    - Riverpod Notifier 이름 규칙
    - 다트 게임 규칙 알려 줘

- lesson: L-0005   # 레이아웃 크기를 바꾸는 기능 → 크기 반응 코드 되먹임 확인
  hit:
    - ⌘+로 글자 키우는 기능 넣어 줘
    - 오른쪽 패널 너비를 드래그로 바꾸게 해 줘
    - 창 크기 줄이면 레이아웃 깨지는 거 고쳐 줘
    - 앱 전체 확대 비율 설정 만들어
    - 사이드바 접기 기능 추가해
  miss:
    - 이미지 크기 줄이는 법
    - 글꼴 이름이 뭐였지?
    - 화면 녹화하는 법
    - 모니터 해상도 확인하는 법
    - 폰트 라이선스 알려 줘

- lesson: L-0006   # 회귀 시험 통과를 근거로 고쳤다고 보고할 때 → 실제로 동작했는지 먼저
  hit:
    - 테스트 다 통과했으니 고쳤다고 해도 돼?
    - zoom_test 초록불이야, 끝난 거지?
    - 시험 돌려서 통과하면 완료 보고해 줘
    - 통합 테스트 패스했어, 버그 해결된 걸로 정리해
    - CI 통과했으니 끝났다고 알려 줘
  miss:
    - 테스트 파일 어디 있어?
    - 기말 시험 일정이 언제야?
    - 회귀 분석이 뭐야?
    - 단위 테스트 이름 짓는 법
    - 통과 기준 문서 보여 줘

- lesson: L-0007   # 확대·축소·이동 콘텐츠 위를 덮는 효과 → 보이는 영역 기준, 축소 상태 확인
  hit:
    - 그래프 위에 선택한 노드 강조 배경 넣어 줘
    - 지도 위에 반투명 막 깔아 줘
    - 노드에 마우스 올리면 주변 어둡게 해 줘
    - 줌 되는 캔버스에 선택 표시 그려 줘
    - InteractiveViewer 위에 오버레이 추가해
  miss:
    - 다크 모드 색상표 알려 줘
    - 확대경 앱 추천해 줘
    - 그래프 노드 개수 몇 개야?
    - 축소판 이미지 만드는 법
    - 지도 앱 추천해 줘

- lesson: L-0008   # 글자·단어 매칭 기능을 만들거나 고칠 때 → 바꾼 말로 시험
  hit:
    - 검색이 다른 말로 물으면 안 걸려, 고쳐 줘
    - 실수 노트 붙는 규칙 손봐 줘
    - 교정 신호 감지 정규식 고쳐
    - 훅이 맞는 노트를 못 찾아, 개선해 줘
    - 표기 사전에 단어 더 넣어 줘
  miss:
    - 검색 기록 지워 줘
    - 단어장 앱 추천해 줘
    - 정규식 문법 알려 줘
    - 노트 개수 몇 개야?
    - 맞춤법 검사해 줘

- lesson: L-0009   # 약점·미측정 항목을 문서에 적을 때 → 할 일에 날짜와 함께
  hit:
    - 아직 안 잰 것들 문서에 정리해 줘
    - 기능검토에 약점 추가해
    - 남은 문제 목록 써 줘
    - 측정 안 한 항목 표로 적어
    - 약점 분석해서 문서로 남겨
  miss:
    - 강점이 뭐야?
    - 측정 단위 바꿔 줘
    - 문서 글꼴 바꿔
    - 발표 자료 표지 만들어
    - 약국 위치 알려 줘

- lesson: L-0010   # 한 경로에서 도구 제약을 찾았을 때 → 다른 경로에도
  hit:
    - brain add를 파이프로 하면 거부돼
    - 이 명령 권한 거부 났어
    - 훅에서 && 쓰면 막히네
    - claude -p에서 이 도구가 막혀
    - 허용 목록 때문에 명령이 안 돌아
  miss:
    - 파이프 오르간 소리 들려 줘
    - 권한 설정 화면 보여 줘
    - 도구 목록 알려 줘
    - 파일 권한 755가 뭐야?
    - 명령 팔레트 단축키 알려 줘

- lesson: L-0011   # 실측 결과 숫자를 문서·보고에 적을 때 → 끝난 데이터로 다시 세기
  hit:
    - 측정 결과 문서에 적어 줘
    - 벤치 숫자 보고서에 넣어
    - 실험 결과 표로 정리해
    - 성능 잰 거 작업일지에 기록해
    - 토큰 실측값 발표 자료에 반영해
  miss:
    - 숫자 서식 바꿔 줘
    - 측정 도구 설치해 줘
    - 보고서 글꼴 바꿔
    - 결과 화면 색 바꿔
    - 숫자 키패드 단축키

- none:
    - 안녕
    - 오늘 날씨 어때
    - 파이썬 리스트 중복 제거 한 줄 코드
    - 정규식으로 휴대폰 번호 검사하는 패턴
    - 자바스크립트 배열 날짜순 정렬
    - 점심 메뉴 추천해 줘
    - 영어 이메일 다듬어 줘
    - 리눅스 디스크 용량 확인 명령
    - 마크다운 표 문법
    - 도커 이미지 줄이는 법
