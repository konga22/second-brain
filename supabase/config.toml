# Supabase 프로젝트 설정 (supabase CLI). project_id는 `supabase link --project-ref <ref>`로 연결한다.
project_id = "second-brain"

[functions.ai-chat]
verify_jwt = true

[functions.ai-verify]
verify_jwt = true

[functions.mock-checkout]
verify_jwt = true

# 로그인 설정 (11/12 사용자 결정: 마감 12/08까지 누구나 가입, 메일 인증 끔). 12/08 뒤 enable_signup = false로 바꾸고 config push.
[auth]
site_url = "https://second-brain-cvj.pages.dev/"
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false
